<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iron Log</title>
<meta name="description" content="Iron Log — hypertrophy workout tracker" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#101113" />

<!-- iOS home-screen support (Safari ignores manifest for most of this) -->
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Iron Log" />

<link rel="icon" href="icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #101113; height: 100%; }
  #root { min-height: 100vh; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .diag { color: #EEEAE5; background: #101113; padding: 24px; font-family: -apple-system, system-ui, sans-serif; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  .diag b { color: #D6293B; }
</style>

<!-- Error reporting FIRST, so it can catch failures from anything below it,
     including the CDN scripts themselves failing to load. -->
<script>
  function showDiag(title, detail) {
    var el = document.getElementById('root');
    if (!el) return;
    el.innerHTML = '<div class="diag"><b>' + title + '</b>\n\n' + (detail || '') + '</div>';
  }
  window.addEventListener('error', function (e) {
    showDiag('App failed to load', (e.message || (e.error && e.error.message) || 'Unknown error') +
      (e.filename ? ('\n\nFile: ' + e.filename + ':' + e.lineno) : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showDiag('App failed to load (promise rejection)', (e.reason && e.reason.message) ? e.reason.message : String(e.reason));
  });
</script>

<!-- React runtime only — no Babel needed anymore, app.js is pre-compiled -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><div class="diag">Loading Iron Log…</div></div>

<script>
  setTimeout(function () {
    var el = document.getElementById('root');
    if (el && el.getAttribute('data-mounted') !== 'true') {
      showDiag('Still loading after 6 seconds',
        'This usually means react or react-dom failed to load from unpkg.com.\n\n' +
        'Try: a different network/WiFi, disabling any content/ad blocker for this site, or a different browser.');
    }
  }, 6000);
</script>

<script src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
